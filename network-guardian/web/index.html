<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Network Guardian</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15212a;background:#f4f7f8}
body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}h1{margin:0 0 6px}.sub{color:#5d6a73;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #dfe7eb;border-radius:18px;padding:16px;box-shadow:0 5px 20px rgba(32,49,59,.05)}.value{font-size:2rem;font-weight:800}.good{color:#137a45}.caution{color:#9a6700}.bad{color:#b42318}.unknown{color:#667085}.muted{color:#667085;font-size:.9rem}.section{margin-top:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:9px;border-bottom:1px solid #edf1f3;text-align:left;white-space:nowrap}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cdd6dc;border-radius:10px}label{display:block;font-size:.85rem;color:#475467;margin-bottom:4px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#175cd3;color:#fff;cursor:pointer}.notice{padding:12px;border-radius:12px;background:#fff7e0;border:1px solid #f1d48a}.event{border-left:4px solid #b42318;padding-left:12px;margin:10px 0}.small{font-size:.8rem;color:#667085}
</style>
</head>
<body><div class="wrap">
<h1>Network Guardian</h1>
<p class="sub">通信品質を「検知 → 切り分け → 再確認」するローカル優先MVP</p>
<div class="notice"><b>安全モード:</b> 自動で行うのは再測定だけです。ルーター再起動、DNS変更、Wi‑Fi切替、WAN切替はまだ実行しません。</div>
<div class="section grid" id="summary"></div>
<div class="section card">
<h2>Cloudflare等の手動測定を追加</h2>
<div class="form">
<div><label>測定場所</label><input id="location" placeholder="far_room"></div>
<div><label>下り Mbps</label><input id="down" type="number" step="0.1"></div>
<div><label>上り Mbps</label><input id="up" type="number" step="0.1"></div>
<div><label>Idle ms</label><input id="idle" type="number" step="0.1"></div>
<div><label>Loaded ms</label><input id="loaded" type="number" step="0.1"></div>
<div><label>メモ</label><input id="note" placeholder="Cloudflare / 最遠部屋"></div>
</div>
<p><button id="save">記録する</button> <span id="saveMsg" class="small"></span></p>
</div>
<div class="section card"><h2>異常イベント</h2><div id="events" class="muted">読み込み中…</div></div>
<div class="section card">
<h2>測定履歴</h2><div class="table-wrap"><table><thead><tr><th>日時(UTC)</th><th>場所</th><th>種別</th><th>状態</th><th>診断</th><th>下り</th><th>上り</th><th>Idle</th><th>Loaded</th><th>Internet RTT</th><th>Loss</th><th>GW RTT</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
const fmt=(v,s='')=>v===null||v===undefined?'—':`${Number(v).toFixed(1)}${s}`;
function card(title,value,unit='',cls='unknown',hint=''){return `<div class="card"><div class="muted">${title}</div><div class="value ${cls}">${value}${unit}</div><div class="small">${hint}</div></div>`}
async function refresh(){
 const [status,ms,evs]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/measurements').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]);
 const m=status.latest||{}; const sev=m.severity||'unknown';
 document.querySelector('#summary').innerHTML=[
   card('現在の状態',(sev==='good'?'良好':sev==='caution'?'注意':sev==='bad'?'要確認':'未測定'),'',sev,m.diagnosis||''),
   card('Internet RTT',fmt(m.internet_rtt_ms),' ms',sev,'自動軽量測定'),
   card('Packet loss',fmt(m.internet_loss_pct),' %',sev,'自動軽量測定'),
   card('Cloudflare Loaded',fmt(m.loaded_latency_ms),' ms',sev,'手動値があれば表示')
 ].join('');
 document.querySelector('#rows').innerHTML=ms.map(x=>`<tr><td>${x.timestamp}</td><td>${x.location_label}</td><td>${x.kind}</td><td class="${x.severity}">${x.severity}</td><td>${x.diagnosis}</td><td>${fmt(x.download_mbps)}</td><td>${fmt(x.upload_mbps)}</td><td>${fmt(x.idle_latency_ms)}</td><td>${fmt(x.loaded_latency_ms)}</td><td>${fmt(x.internet_rtt_ms)}</td><td>${fmt(x.internet_loss_pct)}</td><td>${fmt(x.gateway_rtt_ms)}</td></tr>`).join('');
 document.querySelector('#events').innerHTML=evs.length?evs.map(e=>`<div class="event"><b>${e.diagnosis}</b> — ${e.recommendation}<div class="small">${e.timestamp} / confirmed=${e.confirmed}</div></div>`).join(''):'まだ確認済み異常はありません。';
}
document.querySelector('#save').onclick=async()=>{
 const body={location_label:document.querySelector('#location').value||undefined,download_mbps:document.querySelector('#down').value,upload_mbps:document.querySelector('#up').value,idle_latency_ms:document.querySelector('#idle').value,loaded_latency_ms:document.querySelector('#loaded').value,note:document.querySelector('#note').value};
 const r=await fetch('/api/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json();
 document.querySelector('#saveMsg').textContent=j.ok?'保存しました':`失敗: ${j.error||r.status}`; if(j.ok)refresh();
};
refresh(); setInterval(refresh,30000);
</script></body></html>
